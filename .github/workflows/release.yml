name: "Release"

# Push a version tag (e.g. `git tag v0.1.0 && git push --tags`) to build
# installers for Windows, macOS (Intel + Apple Silicon), and Linux, and
# attach them to a draft GitHub Release. The release is created as a draft
# so nothing goes public until you review it and click "Publish" yourself.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          # Uses a dedicated PAT (Contents: Read and write, scoped to this
          # repo) instead of the default GITHUB_TOKEN - the default token's
          # write access depends on the repo's "Workflow permissions"
          # setting, which proved unreliable for release creation.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "EyeClops v__VERSION__"
          releaseBody: |
            ## Download EyeClops

            Pick the file for your platform - you only need one:

            | Platform | File |
            |---|---|
            | Windows | `EyeClops_..._x64-setup.exe` |
            | macOS (Apple Silicon / M-series) | `EyeClops_..._aarch64.dmg` |
            | macOS (Intel) | `EyeClops_..._x64.dmg` |
            | Linux (Debian/Ubuntu) | `EyeClops_..._amd64.deb` |
            | Linux (Fedora/RHEL) | `EyeClops-...-1.x86_64.rpm` |
            | Linux (other, portable) | `EyeClops_..._amd64.AppImage` |

            The rest of the files (`.msi`, `.app.tar.gz`, source archives) are build artifacts used internally by the updater/packaging tools - safe to ignore unless you specifically need them.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
